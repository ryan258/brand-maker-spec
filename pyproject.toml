[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brand-system-maker"
version = "0.1.0"
description = "A local-first workshop for creating, publishing, exporting, and checking living brand systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "weasyprint>=69,<70",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
brand-maker = "brand_maker.__main__:main"
brand-maker-eval = "brand_maker.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brand_maker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["brand_maker"]

[dependency-groups]
dev = [
    "pdfplumber>=0.11,<1",
    "pypdf>=5,<6",
]
